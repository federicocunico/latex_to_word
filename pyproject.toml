[project]
name = "latex-to-word"
version = "0.1.0"
description = "Overleaf ZIP to DOCX converter with quality verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "PyMuPDF>=1.24.0",
    "scikit-image>=0.24.0",
    "Pillow>=11.0.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]
